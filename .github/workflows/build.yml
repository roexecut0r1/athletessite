name: HML Reimagined — Build & Test

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DISTRO_VERSION: "1.0"
  BASE_ISO: "kubuntu-24.04.2-desktop-amd64.iso"

jobs:
  # ── Generate theme assets ─────────────────────────────────────
  generate-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil sox fonts-inter fonts-dejavu
      
      - name: Generate visual assets
        run: python3 build-scripts/generate-assets.py
      
      - name: Generate sound assets
        run: bash build-scripts/generate-sounds.sh
      
      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: hml-assets
          path: |
            wallpapers/
            config/grub/background.png
            config/plymouth/hml-theme/*.png
            config/sddm/hml-theme/background.png
            branding/logos/
            sounds/

  # ── Build Debian packages ─────────────────────────────────────
  build-packages:
    runs-on: ubuntu-24.04
    needs: generate-assets
    steps:
      - uses: actions/checkout@v4
      
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          name: hml-assets
      
      - name: Build .deb packages
        run: |
          chmod +x packaging/build-debs.sh
          sudo bash packaging/build-debs.sh
      
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: hml-debs
          path: output/debs/*.deb

  # ── Build ISO (on tag push only) ──────────────────────────────
  build-iso:
    runs-on: ubuntu-24.04
    needs: [generate-assets, build-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools genisoimage \
            grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            wget rsync
      
      - name: Build ISO
        run: |
          chmod +x build-scripts/build-iso.sh
          sudo bash build-scripts/build-iso.sh
      
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: hml-iso
          path: output/*.iso
          retention-days: 7

  # ── Test ISO in QEMU ──────────────────────────────────────────
  test-iso:
    runs-on: ubuntu-24.04
    needs: build-iso
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: hml-iso
      
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      
      - name: Boot test (UEFI)
        run: |
          timeout 120 qemu-system-x86_64 \
            -enable-kvm \
            -m 4G \
            -bios /usr/share/OVMF/OVMF_CODE.fd \
            -cdrom output/*.iso \
            -nographic \
            -serial mon:stdio \
            2>&1 | head -200 || true
          echo "✨ Boot test completed"

  # ── Create GitHub Release ─────────────────────────────────────
  release:
    runs-on: ubuntu-24.04
    needs: [build-iso, test-iso]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HML Reimagined ${{ github.ref_name }}"
          body: |
            ✨ **HML Reimagined ${{ github.ref_name }}** ✨
            
            Hannah Montana Linux for the modern era!
            
            ## Downloads
            - **ISO**: Boot from USB or install to disk
            - **Packages**: Install theme on existing Kubuntu/KDE Neon
            
            ## What's Included
            - KDE Plasma 6 with full HML theming
            - 3 visual modes: Classic, Modern, Dark Glam
            - Custom GRUB, Plymouth, SDDM, and desktop themes
            - HML Control Center for easy customization
            - Full UEFI and Secure Boot support
          files: |
            hml-iso/*.iso
            hml-debs/*.deb
          draft: false
          prerelease: false
