<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumin SDK — Game Grid</title>
  <style>
    html,body{height:100%;margin:0}
    body{background:#0a0a0a;color:#fff;font-family:system-ui,Segoe UI,Roboto,Arial}
    .wrap{max-width:1100px;margin:2rem auto;padding:1rem}
    h1{font-size:1.4rem;margin:0 0 1rem}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lumin SDK — Play Games</h1>
    <div id="games"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
  <script>
    Lumin.init({
      container: '#games',
      theme: 'dark',
      onReady: () => console.log('LuminSDK is ready'),
      onError: (err) => console.error('LuminSDK error:', err),
    });
  </script>
</body>
</html>
