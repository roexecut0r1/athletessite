---
# Bootloader module for Calamares — HML Reimagined
# UEFI-only bootloader configuration

efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
timeout: 10

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"

efiBootLoaderId: "HML-Reimagined"

installEFIFallback: true
