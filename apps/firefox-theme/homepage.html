<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ HML Reimagined — Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0D0510;
            color: #E0CCE6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 20, 147, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(156, 39, 176, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(224, 64, 251, 0.05) 0%, transparent 50%);
            z-index: -1;
            animation: bgPulse 10s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.8; }
            100% { opacity: 1.2; }
        }

        /* Sparkle particles */
        .sparkles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .sparkle {
            position: absolute;
            width: 3px; height: 3px;
            background: white;
            border-radius: 50%;
            animation: sparkleAnim 3s ease-in-out infinite;
        }

        @keyframes sparkleAnim {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 0.8; transform: scale(1); }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FF1493, #E040FB, #9C27B0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: #8C7896;
            font-size: 1rem;
        }

        /* Clock */
        .clock {
            text-align: center;
            margin-bottom: 40px;
        }

        .clock .time {
            font-size: 4rem;
            font-weight: 300;
            color: #E0CCE6;
            letter-spacing: -2px;
        }

        .clock .date {
            font-size: 1rem;
            color: #8C7896;
            margin-top: 4px;
        }

        /* Search bar */
        .search-container {
            max-width: 600px;
            margin: 0 auto 48px;
        }

        .search-bar {
            width: 100%;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(156, 39, 176, 0.3);
            border-radius: 16px;
            color: #E0CCE6;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            border-color: #FF1493;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-bar::placeholder {
            color: #6B5070;
        }

        /* Quick links */
        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #FF1493;
            margin-bottom: 16px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(156, 39, 176, 0.15);
            border-radius: 12px;
            text-decoration: none;
            color: #E0CCE6;
            transition: all 0.25s ease;
        }

        .link-card:hover {
            background: rgba(255, 20, 147, 0.08);
            border-color: rgba(255, 20, 147, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(255, 20, 147, 0.1);
        }

        .link-card .icon {
            font-size: 1.5rem;
            width: 36px;
            text-align: center;
            flex-shrink: 0;
        }

        .link-card .label {
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* System info */
        .sys-info {
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(156, 39, 176, 0.1);
        }

        .sys-info-item {
            text-align: center;
        }

        .sys-info-item .value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #FF1493;
        }

        .sys-info-item .label {
            font-size: 0.75rem;
            color: #8C7896;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 48px;
            color: #4A3050;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="sparkles" id="sparkles"></div>

    <div class="container">
        <div class="header">
            <h1>✨ HML Reimagined ✨</h1>
            <p>You got the best of both worlds!</p>
        </div>

        <div class="clock">
            <div class="time" id="clock-time">00:00</div>
            <div class="date" id="clock-date">Loading...</div>
        </div>

        <div class="search-container">
            <input type="text" class="search-bar" id="search" 
                   placeholder="✨ Search the web..." 
                   autofocus>
        </div>

        <div class="section-title">⚡ Quick Access</div>
        <div class="links-grid">
            <a href="https://www.google.com" class="link-card">
                <span class="icon">🔍</span>
                <span class="label">Google</span>
            </a>
            <a href="https://www.youtube.com" class="link-card">
                <span class="icon">▶️</span>
                <span class="label">YouTube</span>
            </a>
            <a href="https://github.com" class="link-card">
                <span class="icon">💻</span>
                <span class="label">GitHub</span>
            </a>
            <a href="https://reddit.com" class="link-card">
                <span class="icon">💬</span>
                <span class="label">Reddit</span>
            </a>
            <a href="https://open.spotify.com" class="link-card">
                <span class="icon">🎵</span>
                <span class="label">Spotify</span>
            </a>
            <a href="https://discord.com/app" class="link-card">
                <span class="icon">🎮</span>
                <span class="label">Discord</span>
            </a>
            <a href="https://store.steampowered.com" class="link-card">
                <span class="icon">🎯</span>
                <span class="label">Steam</span>
            </a>
            <a href="https://flathub.org" class="link-card">
                <span class="icon">📦</span>
                <span class="label">Flathub</span>
            </a>
        </div>

        <div class="section-title">🛠 System</div>
        <div class="links-grid">
            <a href="about:preferences" class="link-card">
                <span class="icon">⚙️</span>
                <span class="label">Settings</span>
            </a>
            <a href="about:addons" class="link-card">
                <span class="icon">🧩</span>
                <span class="label">Extensions</span>
            </a>
            <a href="https://askubuntu.com" class="link-card">
                <span class="icon">❓</span>
                <span class="label">Ask Ubuntu</span>
            </a>
            <a href="https://wiki.archlinux.org" class="link-card">
                <span class="icon">📚</span>
                <span class="label">Arch Wiki</span>
            </a>
        </div>

        <div class="footer">
            HML Reimagined 1.0 "Superstar" — A fan project. Not affiliated with Disney.
        </div>
    </div>

    <script>
        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = 
                now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('clock-date').textContent = 
                now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Search
        document.getElementById('search').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.trim()) {
                window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(this.value);
            }
        });

        // Sparkle particles
        const sparklesContainer = document.getElementById('sparkles');
        for (let i = 0; i < 40; i++) {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 5 + 's';
            s.style.animationDuration = (2 + Math.random() * 4) + 's';
            s.style.width = s.style.height = (1 + Math.random() * 3) + 'px';
            sparklesContainer.appendChild(s);
        }
    </script>
</body>
</html>
