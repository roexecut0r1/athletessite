<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cape Cod Chip Fact</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        height:100vh;
        overflow:hidden;
        font-family:'Fredoka', sans-serif;
        background:
            radial-gradient(circle at top, #ffda7b 0%, #f7b733 35%, #c66a12 100%);
        display:flex;
        justify-content:center;
        align-items:center;
        position:relative;
    }

    /* floating chips */
    .chip{
        position:absolute;
        border-radius:50%;
        background:linear-gradient(145deg,#ffd873,#d78b1f);
        box-shadow:
            inset -8px -8px 18px rgba(0,0,0,.15),
            inset 8px 8px 18px rgba(255,255,255,.25),
            0 10px 20px rgba(0,0,0,.2);
        animation:float 8s ease-in-out infinite;
        opacity:.85;
    }

    .chip::after{
        content:"";
        position:absolute;
        inset:18%;
        border-radius:50%;
        border:3px dashed rgba(120,70,10,.18);
    }

    .folded{
        border-radius:45% 55% 50% 50% / 55% 45% 55% 45%;
        transform:rotate(25deg);
    }

    .c1{ width:130px;height:130px; top:8%; left:8%; animation-delay:0s;}
    .c2{ width:180px;height:180px; bottom:5%; left:18%; animation-delay:1s;}
    .c3{ width:120px;height:120px; top:15%; right:10%; animation-delay:2s;}
    .c4{ width:220px;height:220px; bottom:-40px; right:-20px; animation-delay:3s;}
    .c5{ width:90px;height:90px; top:60%; right:28%; animation-delay:4s;}

    @keyframes float{
        0%,100%{ transform:translateY(0px) rotate(0deg);}
        50%{ transform:translateY(-18px) rotate(8deg);}
    }

    .card{
        width:min(850px,90vw);
        padding:60px;
        border-radius:35px;
        background:rgba(255,255,255,.12);
        backdrop-filter:blur(14px);
        border:2px solid rgba(255,255,255,.2);
        box-shadow:
            0 20px 50px rgba(0,0,0,.25),
            inset 0 0 25px rgba(255,255,255,.08);
        text-align:center;
        z-index:2;
    }

    .label{
        display:inline-block;
        padding:10px 20px;
        border-radius:999px;
        background:rgba(255,255,255,.18);
        color:#fff3d4;
        letter-spacing:2px;
        font-size:.9rem;
        margin-bottom:25px;
        text-transform:uppercase;
        border:1px solid rgba(255,255,255,.2);
    }

    h1{
        font-size:clamp(2.2rem,6vw,5rem);
        line-height:1.05;
        color:white;
        text-shadow:
            0 4px 12px rgba(0,0,0,.25);
    }

    .highlight{
        color:#fff1b1;
    }

    .big{
        display:block;
        font-size:clamp(3rem,10vw,7rem);
        margin:18px 0;
        font-weight:700;
    }

    .footer{
        margin-top:28px;
        color:rgba(255,255,255,.8);
        font-size:1rem;
    }

    .crunch{
        position:absolute;
        bottom:18px;
        width:100%;
        text-align:center;
        color:rgba(255,255,255,.45);
        letter-spacing:6px;
        font-size:.8rem;
        z-index:2;
    }
</style>
</head>

<body>

<div class="chip c1"></div>
<div class="chip c2 folded"></div>
<div class="chip c3"></div>
<div class="chip c4 folded"></div>
<div class="chip c5"></div>

<div class="card">
    <div class="label">Kettle Cooked Statistics</div>

    <h1>
        <span class="highlight">1 in 2</span><br>
        kettle cooked<br>
        <span class="big">Cape Cod Chips</span>
        are folded.
    </h1>

    <div class="footer">
        scientifically crunchy™
    </div>
</div>

<div class="crunch">
    CRUNCH • FOLD • CRUNCH • FOLD • CRUNCH
</div>

</body>
</html>
